name: Publish Escape Area 51 playtest
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: "pages"
  cancel-in-progress: true
jobs:
  publish:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Verify game files are present
        run: |
          test -s index.html
          test -s engine/bot.js
          test -s engine/rules.js
          test -s engine/movement.js
          node --test tests/*.test.js
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload game files
        uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - name: Publish website
        id: deploy
        uses: actions/deploy-pages@v4
